name: Architecture and desktop foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/verify-retired-code.mjs
      - run: node scripts/verify-foundation-boundary.mjs
      - run: node scripts/verify-network-boundary.mjs
      - run: node scripts/verify-scenario-runtime-build.mjs scenarios/web-blackbox
      - name: Local regression (no model credentials or real targets)
        run: pnpm test:fast
