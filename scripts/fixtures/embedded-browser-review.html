<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TraceForge · 原生浏览器验收</title>
  <link rel="stylesheet" href="../../output/embedded-browser-review.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #252629; background: #fff; font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
    .fixture-header { display: flex; align-items: center; gap: 18px; height: 54px; padding: 0 24px; border-bottom: 1px solid #e9eaed; }
    .fixture-brand { font-size: 15px; font-weight: 650; letter-spacing: -.03em; }
    .fixture-header-title { padding-left: 18px; border-left: 1px solid #e5e6e9; color: #585d66; font-size: 12px; }
    .fixture-label { margin-left: auto; color: #626875; font-size: 11px; }
    .fixture-conversation { display: flex; flex-direction: column; width: 45%; min-width: 0; height: calc(100vh - 54px); }
    .fixture-transcript { flex: 1; min-height: 0; overflow: auto; padding: 40px 30px 28px; }
    .fixture-transcript-inner { max-width: 590px; margin: 0 auto; }
    .fixture-intro { margin-bottom: 34px; padding-bottom: 24px; border-bottom: 1px solid #eceef1; }
    .fixture-intro h1 { margin: 0 0 8px; font-size: 23px; font-weight: 600; letter-spacing: -.035em; line-height: 1.3; }
    .fixture-intro p, .fixture-message p, .fixture-note p { margin: 0; }
    .fixture-intro p { color: #626875; font-size: 12px; }
    .fixture-message { margin-bottom: 32px; }
    .fixture-user { display: flex; justify-content: flex-end; }
    .fixture-user p { max-width: 82%; padding: 12px 16px; border-radius: 16px; background: #f2f3f5; font-size: 14px; line-height: 1.7; }
    .fixture-agent-name { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 12px; font-weight: 600; }
    .fixture-agent-name::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #30343a; }
    .fixture-agent p { max-width: 56ch; line-height: 1.8; }
    .fixture-note { margin-top: 38px; padding: 17px 0; border-top: 1px solid #eceef1; border-bottom: 1px solid #eceef1; }
    .fixture-note strong { display: block; margin-bottom: 6px; font-size: 12px; }
    .fixture-note p { color: #626875; font-size: 12px; line-height: 1.75; }
    #result { margin-top: 18px; color: #626875; font-size: 12px; }
    .fixture-footer { padding: 16px 30px 22px; border-top: 1px solid #f0f1f3; color: #767b83; font-size: 11px; }
    .fixture-footer > div { max-width: 590px; margin: 0 auto; }
    @media (max-width: 1000px) { .fixture-conversation { width: 100%; } }
    @media (max-width: 650px) { .fixture-header { padding-inline: 16px; } .fixture-label { display: none; } .fixture-transcript { padding: 28px 20px; } .fixture-footer { padding-inline: 20px; } }
  </style>
</head>
<body>
  <header class="fixture-header"><span class="fixture-brand">TraceForge</span><span class="fixture-header-title">浏览器交接验收</span><span class="fixture-label">本机夹具 · 合成任务数据</span></header>
  <main class="fixture-conversation">
    <section class="fixture-transcript" aria-label="演示对话">
      <div class="fixture-transcript-inner">
        <div class="fixture-intro"><h1>浏览器交接</h1><p>这段对话仅用于本机界面验收。右侧运行真实的原生网页视图。</p></div>
        <div class="fixture-message fixture-user"><p>打开测试页面，我来输入一段文字，再交回给你核对。</p></div>
        <div class="fixture-message fixture-agent"><div class="fixture-agent-name">TraceForge</div><p>页面已经打开。现在由你控制网页；完成输入后，点击右上角的“交回智能体”。交回时会读取同一个页面中的内容。</p></div>
        <div class="fixture-note"><strong>正在进行的验收</strong><p>输入、滚动和文字选择发生在原生网页中。这个窗口不连接真实任务，也不调用模型。</p></div>
        <p id="result" role="status">等待网页操作与交回。</p>
      </div>
    </section>
    <div class="fixture-footer"><div>演示对话 · 浏览器面板使用正式组件</div></div>
  </main>
  <div id="root"></div>
  <script src="../../output/embedded-browser-review.js"></script>
</body>
</html>
